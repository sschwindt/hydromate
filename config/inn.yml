# =============================================================================
# hydromate configuration — TEMPLATE
# =============================================================================
# Copy this file, point the paths at your own data, and build with:
#   hydromate path/to/your-config.yml --check    # validate first
#   hydromate path/to/your-config.yml            # build the case
#
# Conventions:
#   * All relative paths are resolved against THIS file's directory.
#   * Lines marked  [REQUIRED]  must be set; everything else has a sensible
#     default and may be omitted or left commented.
#   * Values shown are a worked example for a reach of the Inn river (Bavaria);
#     replace them with your own. The matching co-development dataset lives under
#     example-Inn/ (kept out of version control).
# -----------------------------------------------------------------------------

project:
  name: inn                    # case name; used in titles and file headers
  crs_epsg: 25832              # [REQUIRED] project CRS, metric (e.g. UTM). 25832 = ETRS89/UTM32N
  work_dir: case               # intermediate rasters etc.
  model_dir: case/simulation   # the TELEMAC case files land here
  results_dir: case/results

telemac:
  # [REQUIRED] the pysource.*.sh of YOUR TELEMAC install; sourced (not imported)
  # whenever the solver or SELAFIN tooling is needed. Machine-specific.
  pysource: /path/to/telemac/configs/pysource.sh
  solver: telemac2d            # telemac2d | telemac3d
  n_processors: 4

inputs:
  # ---- required -----------------------------------------------------------
  dem_initial: path/to/dem.tif                 # [REQUIRED] baseline terrain (GeoTIFF)
  boundary: path/to/roi.gpkg                   # [REQUIRED] ROI / max wetted extent polygon
  liquid_boundaries: path/to/liquid-boundaries.shp  # [REQUIRED] inflow/outflow lines, tagged by a "type" field
  inflow: path/to/inflow.csv                   # [REQUIRED] discharge value or time series

  # ---- optional -----------------------------------------------------------
  # dem_target: path/to/dem-target.tif         # 2nd DEM, enables morphodynamic target
  # breaklines: path/to/breaklines.shp         # internal constraint lines (mesh + zone edges)
  # region_points: path/to/region-points.shp   # seed points carrying a MATID field
  # region_table: path/to/region-pts-table.txt # legend mapping MATID -> material/roughness
  # stage_discharge: path/to/rating-curve.csv  # outlet rating curve: Q [m3/s] vs WSE [m]
  # measurements: path/to/measurements.csv     # calibration points: x,y,water_depth,scalar_velocity
  # dem_of_difference: path/to/dod.tif         # precomputed bed-change raster (else derived from DEMs)

mesh:
  default_size: 10.0           # background target edge length (m)
  breakline_size: 3.0          # refinement along breaklines (m)
  min_size: 0.5
  # optional per-MATID refinement (target edge length in m), keyed by MATID:
  # region_sizes:
  #   1: 1.5
  #   2: 3.0

friction:
  default_law: 4               # 4 = Manning (0 NOFR, 1 HAAL, 2 CHEZ, 3 STRI, 5 NIKU, 7 COWH)
  default_coefficient: 0.03
  # one zone per MATID (the "matid" must equal the MATID in region_points); the
  # coefficient is the initial guess that calibration perturbs. Omit "zones" to
  # use a single uniform default.
  # zones:
  #   - { matid: 1, name: riverbed,   law: 4, coefficient: 0.030 }
  #   - { matid: 5, name: floodplain, law: 4, coefficient: 0.060 }

hydrodynamics:
  regime: steady               # steady | unsteady
  time_step: 1.0
  n_time_steps: 15000
  graphic_printout_period: 500
  listing_printout_period: 500
  # downstream water level: set explicitly, or provide inputs.stage_discharge
  # (a rating curve) and it is interpolated at the inflow discharge.
  prescribed_elevation: 0.0    # [REQUIRED unless stage_discharge is given] m a.s.l.
  # prescribed_flowrate: 47.2  # override the upstream Q; else the mean of the inflow series

# morphodynamics:              # optional GAIA extension (v1 focuses on 2D hydraulics)
#   enabled: true
#   gaia_results_base: rgaia
#   sediment_classes:
#     - { diameter: 0.0008, density: 2650, shields: 0.047 }

calibration:
  calibration_quantities: ["WATER DEPTH"]                    # measured columns used for calibration
  extraction_quantities: ["WATER DEPTH", "SCALAR VELOCITY"]  # quantities pulled from results
  measurement_error: 0.10      # fraction of the measured value
  init_runs: 30                # initial design samples
  max_runs: 50                 # total runs (initial + active-learning iterations)
  gp_library: gpy
  # calibration parameters forwarded to HydroBayesCal. Names follow its prefix
  # convention: zone<MATID> (friction), gaiaCLASSES SHIELDS PARAMETERS <n> (GAIA),
  # vg_zone<MATID>-<p> (vegetation), or any literal TELEMAC keyword.
  parameters:
    - { name: zone1, min: 0.020, max: 0.040, comment: riverbed Manning n }
    # - { name: zone5, min: 0.040, max: 0.090, comment: floodplain }
    # - { name: "gaiaCLASSES SHIELDS PARAMETERS 1", min: 0.030, max: 0.060 }
