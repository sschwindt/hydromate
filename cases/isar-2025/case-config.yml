# =============================================================================
# hydromate case configuration - Isar river (Bavaria), 2025
# =============================================================================
# All relative paths resolve against THIS file's directory. The co-development
# dataset lives under user-sources/ (kept out of version control).
# Build with:
#   hydromate cases/isar-2025/case-config.yml --check    # validate first
#   hydromate cases/isar-2025/case-config.yml            # build the case
#
# Sections: project / telemac / geodata / boundaries / initialization / mesh /
#           friction / hydrodynamics / morphodynamics / ground_truth / calibration
# -----------------------------------------------------------------------------

project:
  name: isar-mar-2025                    # case name; used in titles and file headers
  crs_epsg: 25832              # [REQUIRED] project CRS, metric. 25832 = ETRS89/UTM32N
  sim_dir: hydromate-case
  # Scenario A (PRESCRIBED exchange). Each percolation scenario gets its own tree
  # under hydromate-case/scenarios/ so the two can be compared side by side and
  # neither disturbs the legacy hydromate-case/simulation/ (the failed Jul-2026 run,
  # kept as the evidence behind test-approaches.md).
  preprocessing_dir: hydromate-case/scenarios/prescribed-q/preprocessing
  model_dir: hydromate-case/scenarios/prescribed-q/simulation
  postprocessing_dir: hydromate-case/scenarios/prescribed-q/postprocessing
  calibration_dir: hydromate-case/scenarios/prescribed-q/calibration-validation

telemac:
  # [REQUIRED] the pysource.*.sh of YOUR TELEMAC install; sourced (not imported).
  pysource: /home/modelling/telemac-v911/telemac-mascaret/configs/pysource.debian12.sh
  solver: telemac2d            # telemac2d | telemac3d
  n_processors: 16              # = physical cores (OpenMPI slots; 16 CPUs are hyperthreads)

geodata:
  # Pure geodata files (boundary CONDITIONS are in `boundaries`, ground truth in
  # `ground_truth`). Paths resolve relative to THIS file; data under user-sources/.
  # ---- required -----------------------------------------------------------
  dem_initial: user-sources/geodata/merged-DEM-bathy-corr.tif  # [REQUIRED] baseline terrain (GeoTIFF)
  boundary: user-sources/geodata/roi.gpkg         # [REQUIRED] ROI / max wetted extent polygon
  # ---- optional -----------------------------------------------------------
  # dem_target: user-sources/geodata/DEM-2025-20cm.tif   # 2nd DEM, enables morphodynamic target
  # mesh zones + channel centerline drive the anisotropic, flow-aligned meshing.
  mesh_zones: user-sources/geodata/mesh-zones.gpkg
  channel_centerline: user-sources/geodata/channel-centerline.gpkg
  # roughness zones (integer 'Zone ID') + a CSV mapping id -> ks drive the friction
  # zonation (zone 1 = channel ks ~0.2 m, zone 2 = floodplain ks ~0.5 m).
  roughness_zones: user-sources/geodata/roughness-zones.gpkg
  roughness_table: user-sources/geodata/roughness-table.csv
  # internal cross-sections ("baffles"): after the run the discharge across each
  # line is integrated from r2d.slf into simulation/baffle-XS-q.csv, so the split
  # of the total Q between the threads of the braided reach can be read off (and
  # checked against the FlowTracker transects). Layer is EPSG:4326 - reprojected.
  control_sections: user-sources/geodata/baffles.gpkg
  control_section_name_field: "Baffle Name"
  # dem_of_difference: path/to/dod.tif         # precomputed bed-change raster (else from DEMs)

boundaries:
  # liquid boundaries: a LINE layer whose 'Type (inflow/outflow)' field tags each
  # line; the lines MUST coincide with the OUTER BOUNDS of the mesh zones. Inflow
  # nodes get 4 5 5, outflow nodes 5 4 4 (prescribed elevation) or 4 4 4 (free),
  # every other outer node a solid wall 2 2 2.
  liquid_boundaries: user-sources/geodata/liquid-boundaries.gpkg  # [REQUIRED for a build]
  # inflow: user-sources/hydraulics/inflow.csv   # OPTIONAL discharge series (for a later unsteady case)
  # THIS case's steady boundary conditions, read straight from here for steady2d.cas:
  prescribed_flowrate: 2.4    # inflow Q [m3/s] for steady2d.cas
  # outflow (downstream) boundary type: stage_discharge (WSE from the rating curve
  # at the simulated Q) | elevation (fixed prescribed_elevation) | free (Neumann).
  outflow_condition: stage_discharge
  # prescribed_elevation: 0.0  # m a.s.l.; only for outflow_condition: elevation
  # outlet rating curve (Q,WSE): one Q-h pair at the steady discharge suffices.
  # Left UNSET so each scenario synthesises its own into preprocessing/rating-curve.csv.
  # The old user-sources/geodata/rating-curve.csv gave WSE 815.1139 - 0.25 m BELOW the
  # reach's own normal depth at this section, because it came from the "trapezoid"
  # method: a rectangle as wide as the 9.55 m outflow line at the full depth. The real
  # section is V-shaped, so that idealisation over-states the flow area, returns too
  # low a stage, and the boundary then held the outlet below the natural level. The
  # flow accelerated to pass 2.4 m3/s through the resulting 1.3 m2 gap: |U| ~1.0 m/s
  # mean and 2.2 m/s peak at Fr ~1.4 (supercritical) right at the model outlet.
  # stage_discharge: user-sources/geodata/rating-curve.csv
  # "section" integrates the ACTUAL DEM cross-section along the outflow line with the
  # ks of the roughness zone each sample falls in -> WSE 815.359 at Q=2.4 m3/s.
  rating_method: section
  # Internal ('int-*') losing/gaining lines in the layer above (int-outflow-lose
  # -0.065, int-inflow-gain +0.065 m3/s: percolation through the gravel patch)
  # become TELEMAC SOURCE REGIONS. Each line is buffered to a strip this wide, so
  # the exchange spreads over many cells as a gentle depth rate (Q/area) instead
  # of hammering the few nodes under the line. That concentration is what dried
  # cells, spiked velocities and collapsed the adaptive time step in the Jul-2026
  # runs - TELEMAC has NO depth guard on negative sources. See test-approaches.md.
  # 12.0 m (not 3.0): with percolation.losing_region: line the withdrawal is drawn
  # from this strip, which must hold enough WET area at steady state to supply
  # 0.065 m3/s. Measured on the converged run: a 3 m strip holds only 42 m2 wet
  # (needs 1.54 mm/s, over the max_rate ceiling), 12 m holds ~183 m2 (0.36 mm/s).
  internal_source_region_width: 12.0  # [m] width of the buffered source-region strip

initialization:
  # dry start (default): the domain starts dry except a thin plug at the inflow line
  # (a fully dry bed makes DEBIMP abort at the prescribed-Q inflow). Tune if needed:
  # dry_start_depth: 0.5    # inflow-plug seed depth [m]
  # dry_start_extent: 7.5   # plug buffer around the inflow line [m] (default ~5 cells)
  # Pre-wetted hotstart for the HydroBayesCal calibration fleet: every calibration
  # run starts from a wet channel instead of marching the wetting front from the
  # inflow (the dry-start march took ~17 h of wall time on this 680k-element mesh;
  # comment this out to return to the dry start).
  # 0.30 m, NOT 1.0 m: a 1.0 m seed dumps several times too much water into this
  # shallow, low-flow reach (the stalled Jul-27 run held 6408 m3 against the 3429 m3
  # of the converged run). The excess then drains as thin films over ks 0.2-0.5 m
  # roughness zones - the "EXTREMLY HIGH VALUE OF FRICTION" storm - and the boundary
  # fluxes never balance within the run duration. See test-approaches.md (attempt 2).
  prewet_depth: 0.30        # ALTERNATIVE hotstart: wet the whole channel zone (needs geodata.mesh_zones)
  # HOW that surface is built. "constant" (the old behaviour) put it at a low bed
  # percentile per 5 m bin PLUS prewet_depth; on this braided reach that percentile
  # sits well above the thalweg, so the seeded surface landed a median 0.28 m ABOVE
  # the surface the run converges to (up to +0.60 m), flooding bar tops and bank
  # shelves. Measured on the Aug-2026 5000 s runs: 14958 m2 / 4815 m3 seeded against
  # 7101 m2 / 2182 m3 that actually carries flow, leaving 4694 m2 of stagnant film
  # (35 % of the wetted area, 74 % of it seeded) that had STOPPED draining - it fell
  # only 1.8 % between t=1900 s and t=5000 s, so a longer run cannot remove it.
  # "normal-depth" instead cuts a real cross-section every prewet_bin_spacing metres
  # and seeds the NORMAL-FLOW stage of that section at prescribed_flowrate
  # (rating.stage_for_discharge - the same Keulegan conveyance inversion that builds
  # the outflow rating), so the seed tracks the converged surface: median -0.004 m,
  # p90 +0.26 m, and the area seeded above the converged surface drops from
  # 6052 m2 to 749 m2. See test-approaches.md (section R2).
  prewet_mode: normal-depth
  # Fraction of that normal depth to seed. BELOW 1 ON PURPOSE: under-seeding is
  # recoverable (the flow refills a pool within seconds - the 500 m3 gap here is
  # ~200 s of inflow), over-seeding is not. Calibrated against the converged result:
  # 1.00 -> +0.13 m too high, 0.80 -> +0.03, 0.70 -> -0.03, 0.60 -> -0.08.
  prewet_fill: 0.70
  # Leave a node dry rather than seed a film thinner than this. A feathered seed
  # margin carries no flow worth hotstarting and is exactly what stalls as film.
  prewet_min_depth: 0.05
  # Measure that depth from each node's SPILL elevation (the lowest rim it must cross
  # to reach the outflow) instead of from its bed, so no water is seeded below the rim
  # of a closed depression. TELEMAC-2D has neither infiltration nor evaporation, so
  # water seeded into a bowl the flow would never fill CANNOT LEAVE - it survives to
  # the end of the run as a stagnant, wrongly wetted alcove or side channel, and no
  # amount of extra runtime repairs it. Measured on the Aug-2026 result: 4899 m2 of
  # the 14411 m2 wetted area (34%) was standing still at under 2 cm/s, holding 322 m3,
  # and 92% of that area had been seeded by the pre-wet. On freely draining ground the
  # spill elevation equals the bed, so the open channel is seeded exactly as before.
  drainable_prewet: true

mesh:
  # Anisotropic, flow-aligned strategy (used when geodata.mesh_zones +
  # geodata.channel_centerline are set). Each mesh-zone polygon is sized by its own
  # 'Max Edge Length (m)' field; the *_size values below are FALLBACKS.
  channel_size: 0.3            # fallback channel edge length (m)
  floodplain_size: 0.75         # fallback floodplain edge length (m); default outside all zones
  refinement_size: 0.3         # fallback 'refinement' zone edge length (m)
  # zone_size_field: "Max Edge Length (m)"  # per-polygon edge length field (default shown)
  growth_ratio: 1.2            # max edge-size growth per element (channel -> floodplain)
  channel_anisotropy: 4.0      # along-flow / cross-flow edge ratio in the channel
  max_aspect_ratio: 4.0        # hard cap on cell aspect ratio (AnisoMax + post-mesh edge flips)

friction:
  # .tbl priority: explicit `zones` (MATID) -> roughness zones (geodata.roughness_zones
  # + roughness_table: one `<Zone ID> NIKU <ks> NULL` row each) -> single default.
  roughness_law: 5             # law for roughness-zone rows (5 = NIKU, ks in m)
  default_law: 4               # 4 = Manning (0 NOFR, 1 HAAL, 2 CHEZ, 3 STRI, 5 NIKU, 7 COWH)
  default_coefficient: 0.03
  # lateral (wall) boundary friction; also the roughness used to synthesise the
  # outflow stage-discharge curve when missing.
  boundary_law: 3              # 3 = Strickler
  boundary_coefficient: 30     # Strickler Kst

hydrodynamics:
  regime: steady               # steady | unsteady (the initial run is always steady)
  # With variable_timestep on, time_step is only the conservative CFL START step; the
  # run marches to steady state for `duration` seconds while TELEMAC holds the Courant.
  time_step: 0.25              # conservative CFL start step [s]
  # 1500 s suffices for the PRE-WETTED hotstart: the monitored run balanced its
  # boundary fluxes to <1% after ~430 s of simulated time; the dry-start wetting
  # march needed 5000 s. 4000 s gives ~9x margin on the pre-wetted march while
  # keeping a ladder rung affordable - extend it on the rung that converges.
  # 5000 s, not 4000: at 4000 s the relative flux imbalance was still 2.07e-3
  # (prescribed-q) / 1.17e-3 (green-ampt), i.e. the domain was still draining the
  # last of the pre-wet excess at ~0.2% of the throughflow (mass closes to 1e-5
  # m3/s, so it is real drainage, not solver error). The imbalance decays
  # exponentially with an e-folding time of ~1300 s / ~1100 s, which puts the
  # 1e-3 hydraulic grade (hydrodynamics.flux_tolerance) at ~4950 s / ~4360 s.
  duration: 5000.0             # simulated time [s] for the steady march to convergence
  n_time_steps: 5000          # only bounds a FIXED-step run (variable_timestep: false)
  graphic_printout_period: 500
  listing_printout_period: 500
  finite_volumes: false        # true -> HLLC finite-volume kernel (const viscosity only)
  # Turbulence: "auto" picks k-epsilon (3) / Spalart-Allmaras (6) / Smagorinski (4)
  # from the mesh resolution vs the flow depth and the velocity guess.
  turbulence_model: auto       # auto | 1 const | 3 k-epsilon | 4 Smagorinski | 6 Spalart-Allmaras
  initial_velocity_guess: 1.0  # assumed mean flow [m/s]; sizes eddy viscosity + model choice
  # Courant 0.6 for the pre-wetted calibration fleet (no advancing dry front, the
  # locally-implicit distributive scheme takes it; ~2x larger dt than the 0.30
  # default that guards the dry start).
  desired_courant: 0.60        # target Courant for the CFL-adaptive march (default 0.30)
  # Divergence guard (CONTROL OF LIMITS + LIMIT VALUES). It was hand-commented out
  # of the generated steady2d.cas during the Jul-2026 debugging - a hand-edit that a
  # rebuild silently reverts. It is config-driven now, so switching it off for a
  # diagnosis is reproducible. Keep it ON unless a run needs the clip removed.
  control_of_limits: true
  # More-implicit depth/velocity update (0.80). The Jul-2026 hand-edit lowered it to
  # 0.60, which under-damps the wetting/drying front; set it here (not in the .cas)
  # if a rung needs it.
  implicitation: 0.80

gain_lose:
  # GAIN-LOSE REACH: flow that leaves the surface through this porous gravel bar and
  # returns to it downstream (user-sources/geodata/percolation-zone.gpkg: one
  # 'main-side' patch, ~110 x 15 m, porous depth 0.5 m). A 2D model has no
  # subsurface, so the underflow is a withdrawal where the water infiltrates plus an
  # injection where it resurfaces. `enabled` selects the generated USER_RAIN routine
  # (depth-limited and mass-exact); see the GainLose docstring in config.py.
  enabled: true
  zone: user-sources/geodata/percolation-zone.gpkg
  # WHERE the exchange happens. "lines" pins it to the int-* lines drawn in
  # liquid-boundaries.gpkg, which is right HERE because this reach's exchange faces
  # were surveyed and calibrated (T6 in test-approaches.md): the loss is taken from
  # the CHANNEL at the losing line, where the water actually infiltrates - not from
  # the dry bar it then flows beneath. The magnitude likewise comes from those lines'
  # own flow column (0.065 m3/s each way), so no `discharge` key is needed.
  # The core default is "water-table", which derives both faces from the bar's
  # phreatic surface and needs no drawn lines at all - use that for a new reach where
  # it is fuzzy exactly where percolation begins and ends. On this bar it gives a
  # 5.30 permille table (against 7.39 from the lines) and a self-determining
  # 0.21 m3/s at kf=3e-4, i.e. kf would have to be calibrated down to reproduce the
  # measured 0.065.
  faces: lines
  min_depth: 0.05            # [m] never extract below this depth (fortran mode)
  taper_depth: 0.05          # [m] linear taper band above min_depth (fortran mode)
  # ALSO drain standing surface water off the bar itself. The patch is porous gravel:
  # water lying on top infiltrates instead of ponding, so surface water there is an
  # artefact of a 2D model with no subsurface. With losing_region: line the prescribed
  # exchange is drawn from the channel and nothing removes water on the bar - the
  # Aug-2026 result had 807 m2 of the 2188 m2 patch wetted, 620 m2 of it perched above
  # the local water surface (88 % of that seeded by the old pre-wet). The drain is an
  # extra losing region covering the patch OUTSIDE the strips the prescribed exchange
  # already uses (it is added last, and each node belongs to the first region that
  # contains it, so there is no double counting); it is depth-limited by the same
  # min_depth / taper_depth guard and whatever it takes is added to what the gaining
  # line reinjects, so the routine stays mass-exact.
  patch_drain: true
  # WATER TABLE under the bar. The patch exchanges with the channel at the losing
  # line (measured WSE 817.318 m) and the gaining line (816.807 m); the surface
  # joining those two levels IS the water table of the through-flow, and its
  # gradient is what drives the exchange. Fitted as a plane (7.65 permille,
  # residual 0.049 m) it wets 118 m2 / 10.4 m3 inside the patch - filling the
  # 0.33 m deep DEM pool to its rim - while leaving 95 % of the patch dry with
  # 0.37 m of freeboard. It is clipped to the patch polygon; the same plane would
  # otherwise stand above 22 598 m2 of bed elsewhere in the domain.
  # Why it is needed: that pool sits on a bar ABOVE the channel, so no surface flow
  # can ever reach it, and the drainable-seed filter deliberately refuses to seed
  # anything behind a rim. Without a water table it stays dry (or holds the 2.6 cm
  # skim the drain leaves) for the whole run. With it, the pre-wet seeds it and the
  # patch drain tapers to zero AT THE TABLE instead of at min_depth, so the drain
  # still clears the bar top but cannot empty the pool.
  water_table: phreatic
  # Measured on the converged Aug-2026 run. Left unset, the levels are read off the
  # seeded surface at build time (817.251 / 816.878 here - within 0.07 m, and with
  # opposite signs at the two ends, so mid-patch they agree to ~2 mm).
  water_table_levels:
    losing: 817.318
    gaining: 816.807

drying:
  # Remove water too thin to be surface flow. On this bed (Nikuradse ks 0.05-0.5 m)
  # water 5 mm deep is not flowing OVER the bed, it is standing WITHIN the grain
  # roughness, and physically it drains into the substrate. A 2D model has no
  # substrate, so it stays put and paints a wetted area far larger than the reach
  # has: measured on the Aug-2026 green-ampt result, the sub-centimetre band covered
  # 1503 m2 - 13 % of the wetted AREA - while holding 4.4 m3, i.e. 0.16 % of the
  # volume. Invisible in any budget, dominant in any picture.
  # TELEMAC has no keyword for this: H CLIPPING + MINIMUM VALUE OF DEPTH do the
  # OPPOSITE (the dico says the truncation "is equivalent to adding mass") and are
  # marked "not fully implemented". So the term is generated into the same USER_RAIN
  # routine the percolation exchange uses, and what it withdraws is reinjected at the
  # gaining line - mass-exact. That matters: a net domain sink S would make the
  # steady budget read |Q_in| - |Q_out| = S, putting a floor of ~1.8e-3 under the
  # relative flux imbalance (above the 1e-3 tolerance), so no hotstart would ever be
  # written.
  film_infiltration: true
  film_depth: 0.01       # [m] shallower than this ...
  film_velocity: 0.005   # [m/s] ... AND slower than this = film. The velocity gate
                         # is what keeps the term off the active wet/dry margin.
  film_rate: 1.0e-5      # [m/s] withdrawal rate; clears a 5 mm film in ~500 s

# morphodynamics:              # optional GAIA extension (v1 focuses on 2D hydraulics)
#   enabled: true
#   gaia_results_base: rgaia
#   sediment_classes:
#     - { diameter: 0.0008, density: 2650, shields: 0.047 }

dem_of_difference:
  # Optional DoD (geodata.dem_target - geodata.dem_initial) with a minimum level of
  # detection; off here (dem_initial and dem_target are the same 2025 survey). Point
  # dem_target at a different-epoch DEM to enable. See cases/case-template for options.
  enabled: false
  # uncertainty_initial: 0.05
  # uncertainty_target: 0.03
  # confidence_level: 0.95
  # min_lod: 0.10
  mask_below_lod: true

openfoam:
  # OPTIONAL 3D free-surface (interFoam) extension - see openfoam_preprocessing.py.
  # Purely additive: delete this block and nothing about the TELEMAC case changes.
  # The 3D case is built from the converged 2D result (simulation/r2d.slf), so run
  # preprocessing.py -> initial_run.py first.
  bashrc: /home/modelling/OpenFOAM/OpenFOAM-9/etc/bashrc
  n_processors: 16

  # ---- the TELEMAC pre-run that seeds this case ---------------------------
  # TELEMAC answers in minutes what OpenFOAM would otherwise spend hours
  # discovering: where the water is, how deep it is, and roughly where its surface
  # sits. That seed puts the wetted cells in water at t=0, clamps the lid just above
  # the surface so most air cells never exist, and trims the footprint to the wetted
  # corridor. Without it the case is built COLD under a flat lid.
  #
  # The seed is an approximation and is treated as one: the 3D surface is still
  # solved and free to leave it (that is what freeboard and wet_margin are room for),
  # and the run reports afterwards whether it ever needed more.
  pre_run:
    enabled: true          # uncheck to never start TELEMAC (also: --no-pre-run)
    reuse: true            # this case's converged r2d.slf beats a fresh coarse run
    dimension: 2d          # 3d also seeds a vertical velocity PROFILE per column
    # Only used when there is no r2d.slf to reuse: how much coarser the dedicated
    # pre-run is meshed. x4 on this reach builds AND runs in 54 s and gives a mesh
    # within 3% of the one the full production result seeds.
    size_scale: 2.0
    courant: 0.6           # pre-wetted, so it can march faster than the dry start
    prewet_depth: 0.5      # [m] hotstart the channel zone
    require: warn          # warn | error, if the pre-run misses flux balance

  # ---- mesh ---------------------------------------------------------------
  # A terrain-following, all-hexahedral, structured lattice written straight to
  # constant/polyMesh. NOT snappyHexMesh: a river bed is a single-valued height
  # field, so it is followed rather than snapped to, which removes the castellate/
  # snap stage where that mesher degenerates.
  cell_size: 0.5           # plan dx [m]; ~ the 0.3 m channel zone of the 2D mesh
  n_layers: 14             # sigma layers per column
  # 0.5 m x 14 over the wetted corridor gives ~1.6 M cells (~28,200 m2 of footprint).
  # `hydromate openfoam case-config.yml --check` reports the count without building.

  # ---- what is actually solved: vof | rigid-lid ---------------------------
  # `vof` (default) is the real two-phase interFoam model: the free surface is found
  # rather than prescribed, which is what you want for the answer.
  #
  # `rigid-lid` is for GETTING THERE. It puts the lid ON the 2D free surface as a
  # slip wall, so the mesh holds water only and alpha is identically 1 - interFoam
  # degenerates to a single-phase run while p_rgh and gravity stay intact. The air
  # phase is gone by construction, not damped: no interface Courant limit, no air
  # jets, no spin-up stage. The cost of that is the assumption, and it is a real one:
  # the free surface can no longer move, so the run cannot tell you about a hydraulic
  # jump, a standing wave, or superelevation in a bend. Use it to shake out the mesh,
  # the boundaries and the roughness cheaply, then switch to `vof` for the answer.
  #
  # Measured on this case (5x coarse, 14,632 cells, one core):
  #   vof        0.5 m  1,579,074 cells   dt 3.1e-3 s   ~97,600 steps for 300 s
  #   rigid-lid  1.5 m     36,164 cells   dt 1.8e-1 s     ~1,700 steps, ~8 min
  #   rigid-lid  2.5 m     14,632 cells   dt 3.7e-1 s        832 steps, 91 s wall
  # mode: rigid-lid

  # Coarsen relative to the 2D channel resolution instead of restating a dx. One
  # number, so a test run cannot silently drift away from the mesh being tested.
  # cell_size_factor: 5.0    # -> 2.5 m here; overrides cell_size when set

  domain: wetted           # mesh only the 2D wetted corridor, not the whole 66,000 m2 ROI
  wet_margin: 5.0          # [m] buffer, so the bank walls stand on dry ground
  align_to_flow: true      # rotate the lattice onto the reach axis (+32.9 deg here)

  # ---- the air phase ------------------------------------------------------
  # The lid is clamped this far above the 2D free surface instead of being a flat
  # plane over the terrain. That is the single biggest lever on interFoam's cost and
  # stability here: air that does not exist as cells cannot drive the Courant number,
  # and the atmosphere patch stays close to the interface where inletOutlet /
  # totalPressure behave. It must still exceed any surface rise the 3D run can make,
  # or the flow hits the lid - 0.5 m against a 0.22 m median depth is ample.
  lid: follow
  freeboard: 0.5           # [m]
  # How freeboard and wet_margin are chosen. `auto` sizes both from the seed's own
  # flow - the velocity head V2/2g the water could convert, plus a quarter of the
  # depth for what a depth-averaged model cannot see at all - and treats the values
  # here as FLOORS, never caps. On this slow reach (p95 0.90 m/s, 0.22 m deep) that
  # comes to 0.10 m, so both stay at the values above; a 3 m/s reach 1 m deep would
  # get 0.71 m instead. `fixed` uses them exactly as written.
  headroom_mode: auto      # auto | fixed
  bank_slope: 0.1          # [-] turns a surface rise into the wet_margin it needs
  # |U| cap enforced by the limitVelocity fvConstraint. Left unset it becomes 5x the
  # reach's own p95 water speed (~4.5 m/s here). Water never reaches it; a runaway
  # air jet does, and that is what collapses the time step.
  # air_velocity_cap: 4.5

  # ---- bed ----------------------------------------------------------------
  # The bed layer is pinned to 2x the wetted median ks, so the first cell CENTRE
  # clears the roughness crests and nutkRoughWallFunction is admissible. NOTE this
  # reach's roughness (ks 0.085-0.5 m) is a large fraction of its depth (median
  # 0.22 m), so ~40% of wetted bed faces fail that test even so - the build reports
  # the share. Refining towards the bed does not help; it makes it worse. Read the
  # result as bulk flow, not as a resolved bed boundary layer.
  # Under a rigid lid this defaults OFF: pinning a thick bed layer into a 0.2 m
  # column leaves the layers above it thin enough that the bed's variation within one
  # plan cell folds them, and checkMesh rejects the result (48 incorrectly-oriented
  # face pyramids, 84 deg non-orthogonality; 0 and 75 deg with it off).
  auto_bed_layer: true
  turbulence: kOmegaSST

  # Shallower columns than this are left out of a rigid-lid mesh. It cannot be raised
  # much on this reach: the inflow sections are themselves under 0.25 m, so 0.25 trims
  # the inlet patches away entirely. The layer count is then fitted to it - cells
  # thinner than the bed grains are meaningless, so 14 layers over 0.20 m is reduced
  # to 4 and the build says so.
  min_water_depth: 0.20    # [m], rigid-lid only

  # ---- run ----------------------------------------------------------------
  spinup_time: 30.0        # stage 1: settle the interface from the depth-averaged 2D
                           # state. Not written under a rigid lid: no interface.
  end_time: 300.0          # stage 2 end
  spinup_courant: 0.3
  max_courant: 0.9         # semi-implicit MULES (MULESCorr) makes this affordable
  write_interval: 10.0

ground_truth:
  # Calibration ground truth: a tidy multi-tab table (measurements) OR raw sources
  # hydromate compiles into it. Compiled to preprocessing/ground-truth.xlsx unless
  # `measurements` gives an explicit output path.
  # measurements: path/to/ground-truth.xlsx    # (a) user-authored tidy table
  sources:                                      # (b) raw sources -> compiled tidy table
    # FlowTracker2 Sept-2025 campaign (KB15 sheet = sheet 0 of the revised
    # FT_TKE_Summary.xlsx: one row per vertical at ~0.6 x depth, numeric IDs
    # 1501..1530), joined by ID to the DGPS positions GeoPackage (EPSG:25832,
    # z = bed elevation from the DGPS survey).
    - { category: hydraulics, kind: flowtracker, join_key: ID,
        values: user-sources/ground-truth/hydraulics/FT_TKE_Summary.xlsx,
        positions: user-sources/geodata/flowtracker2/dgps-flowtracker-kb15-sept25.gpkg }

calibration:
  # calibration target set by run_Bayes_cal.py: SCALAR VELOCITY (FlowTracker at
  # 0.6 x depth ~ depth-averaged velocity); WATER DEPTH is extracted alongside.
  calibration_quantities: ["SCALAR VELOCITY"]                # measured columns used for calibration
  extraction_quantities: ["WATER DEPTH", "SCALAR VELOCITY"]  # quantities pulled from results
  measurement_error: 0.10      # fraction of the measured value
  # initial design of experiments: factorial (equidistant grid over the parameter
  # ranges, bayesvalidrox/chaospy rule "grid") -> 8 full-complexity telemac2d runs,
  # then Bayesian Active Learning adds up to (max_runs - init_runs) more.
  parameter_sampling_method: grid
  init_runs: 8                 # initial (factorial) design samples
  max_runs: 15                 # total runs (initial + active-learning iterations)
  gp_library: gpy
  # Calibrate the CHANNEL roughness only (zone1 = roughness zone 1 in friction.tbl).
  # Bounds from the bed GSD (d50 ~ 0.05 m, d90 ~ 0.15 m): ks in [d50, 3*d90]
  # = [0.05, 0.45] m (van Rijn: ks = 1..3 x d90). The floodplain (zone2) stays at
  # its roughness-table value (0.5 m).
  parameters:
    - { name: zone1, min: 0.05, max: 0.45, comment: "channel ks [m] (Nikuradse), d50..3*d90" }
    # - { name: zone2, min: 0.10, max: 1.00, comment: "floodplain ks [m] (Nikuradse)" }
    # - { name: "gaiaCLASSES SHIELDS PARAMETERS 1", min: 0.030, max: 0.060 }
