# =============================================================================
# axqua case configuration - TEMPLATE
# =============================================================================
# Copy the whole cases/case-template/ folder to cases/<your-case>/, drop your
# data into user-sources/, edit the paths/values below, then:
#   axqua cases/<your-case>/case-config.yml --check    # validate first
#   axqua cases/<your-case>/case-config.yml            # build the case
# or run the example scripts (see USAGE.info).
#
# Conventions:
#   * All relative paths are resolved against THIS file's directory.
#   * Lines marked  [REQUIRED]  must be set; everything else has a sensible
#     default and may be omitted or left commented.
#   * Your source data lives in this case's user-sources/ folder (gitignored).
#
# Sections: project / telemac / geodata / boundaries / initialization / mesh /
#           friction / hydrodynamics / morphodynamics / dem_of_difference /
#           ground_truth / calibration
# -----------------------------------------------------------------------------

project:
  name: my-case                # case name; used in titles and file headers
  crs_epsg: 25832              # [REQUIRED] project CRS, metric (e.g. UTM). 25832 = ETRS89/UTM32N
  # all produced artifacts live under sim_dir, split by workflow phase. Each
  # phase's script writes its outputs and its axqua.log into its own folder.
  sim_dir: axqua-case
  preprocessing_dir: axqua-case/preprocessing          # preprocessing.py products (DEM clips, meshes, ground truth)
  model_dir: axqua-case/simulation                     # the TELEMAC case (build): geometry/cli/cas/tbl + results
  postprocessing_dir: axqua-case/postprocessing        # mesh-convergence study and other post-processing
  calibration_dir: axqua-case/calibration-validation   # HydroBayesCal artifacts (calibration CSV, config_Telemac.py)

telemac:
  # ---- WHERE TELEMAC IS, AND HOW TO ENTER IT ------------------------------
  # `environment:` is optional. Omitted, axqua sources `pysource` in a POSIX
  # shell - which is what every Linux case wants and what older configs did.
  #
  #   environment: posix              # bash -lc 'source <pysource>; ...'   (Linux/macOS)
  #
  #   environment:                    # native Windows: a .bat through cmd
  #     kind: windows
  #     setup_script: C:\telemac\v9.1\configs\pysource.bat
  #     mpi_launcher: mpiexec         # MS-MPI, not mpirun
  #
  #   environment:                    # or through WSL
  #     kind: wsl
  #     distro: Ubuntu-22.04
  #     setup_script: /opt/telemac/configs/pysource.sh   # a path INSIDE the distro
  #
  # `shell:` points at a bundled bash where a distribution ships one (blueCFD-Core
  # and the ESI OpenFOAM package both do). Check any of this with:
  #     axqua status case-config.yml --check-env

  # [REQUIRED] the pysource.*.sh of YOUR TELEMAC install; sourced (not imported)
  # whenever the solver or SELAFIN tooling is needed. Machine-specific.
  pysource: /path/to/telemac/configs/pysource.sh
  solver: telemac2d            # telemac2d | telemac3d
  n_processors: 4

geodata:
  # Pure geodata files. Paths resolve relative to THIS file; put your data under
  # user-sources/. The boundary CONDITIONS live in the `boundaries` section below,
  # and the calibration ground truth in `ground_truth`.
  # ---- required -----------------------------------------------------------
  dem_initial: user-sources/geodata/dem-initial.tif      # [REQUIRED] baseline terrain (GeoTIFF)
  boundary: user-sources/geodata/roi.gpkg                # [REQUIRED] ROI / max wetted extent polygon

  # ---- optional -----------------------------------------------------------
  dem_target: user-sources/geodata/dem-target.tif        # 2nd DEM, enables morphodynamic target
  # mesh zones (polygons with a 'Zone Name' of channel/floodplain) + the channel
  # centerline drive the anisotropic, flow-aligned meshing (see the `mesh` block).
  mesh_zones: user-sources/geodata/mesh-zones.gpkg
  channel_centerline: user-sources/geodata/channel-centerline.gpkg
  # roughness zones: polygons with an integer 'Zone ID', plus a CSV mapping each
  # id to a roughness value (e.g. Nikuradse ks). The value is interpolated onto
  # the mesh nodes (per-node FRIC_ID + BOTTOM FRICTION) and later adjusted by
  # HydroBayesCal. Typical: zone 1 = channel (ks ~0.2 m), zone 2 = floodplain (~0.5 m).
  roughness_zones: user-sources/geodata/roughness-zones.gpkg
  roughness_table: user-sources/geodata/roughness-table.csv
  # breaklines: user-sources/geodata/breaklines.shp     # internal constraint lines (mesh + zone edges)
  # region_points: user-sources/geodata/region-points.shp  # seed points carrying a MATID field
  # region_table: user-sources/geodata/region-pts-table.txt  # legend mapping MATID -> material/roughness
  # internal cross-sections: a LINE layer whose lines are integrated from the
  # RESULT after a run (Q = int (H*U).n ds) into simulation/baffle-XS-q.csv, one row
  # per line. Because it reads the result rather than the steering file, the sections
  # can be drawn and moved in GIS without re-running the solver - which is how the
  # split of the total discharge between the threads of a braided reach is read off
  # and checked against field transects. Any CRS (reprojected on ingest).
  # control_sections: user-sources/geodata/cross-sections.gpkg
  # control_section_name_field: "Section Name"   # attribute naming each line
  # dem_of_difference: user-sources/geodata/dod.tif     # precomputed bed-change raster (else derived from DEMs)

boundaries:
  # liquid boundaries: a LINE layer whose 'Type (inflow/outflow)' field tags each
  # line 'inflow' or 'outflow' (you may have several of each). The lines MUST
  # coincide with the OUTER BOUNDS of the mesh zones so the contour nodes fall on
  # them. Contour nodes on an inflow line get a prescribed-Q boundary (4 5 5),
  # those on an outflow line a free/Neumann (4 4 4) or prescribed-elevation
  # (5 4 4) boundary (see outflow_condition); every other outer node is a solid
  # wall (2 2 2). For stability the total inflow-node count should be within ~10%
  # of the total outflow-node count (else a warning fires).
  liquid_boundaries: user-sources/geodata/liquid-boundaries.gpkg  # [REQUIRED for a build]
  # inflow: user-sources/hydraulics/inflow.csv   # OPTIONAL discharge time series (csv)
  #   The steady initial run uses the scalar prescribed_flowrate below; the inflow
  #   series is only needed for a later UNSTEADY (varying-hydrograph) case.

  # the inflow Q (m3/s) and the outflow stage (H) prescription below are THIS case's
  # steady boundary conditions, read straight from here for steady2d.cas (the
  # preprocessing / mesh-convergence scripts no longer hard-code a discharge).
  prescribed_flowrate: 47.2    # inflow Q [m3/s] for steady2d.cas (set THIS case's discharge)
  # outflow (downstream) boundary type:
  #   elevation       -> prescribed water level (cli 5 4 4) fixed at
  #                      prescribed_elevation below (the DEFAULT).
  #   stage_discharge -> prescribed water level (cli 5 4 4) read from the
  #                      stage_discharge rating curve at the simulated Q. One Q-h
  #                      pair at the steady discharge suffices.
  #   free            -> Neumann / free outflow (cli 4 4 4); nothing prescribed.
  outflow_condition: elevation
  prescribed_elevation: 0.0    # downstream water level [m a.s.l.] (outflow_condition: elevation)
  # outlet rating curve (only for outflow_condition: stage_discharge): a CSV with
  # Q [m3/s] and WSE [m] columns. One Q-h pair at the steady discharge is enough.
  # Generate one from a Manning/Strickler value and the channel geometry with:
  #   axqua rating -o user-sources/geodata/rating-curve.csv \
  #       --manning 0.035 --slope 0.0012 --width 80 --side-slope 2 \
  #       --bed-elevation <outflow bed z> --q <steady Q>
  # stage_discharge: user-sources/geodata/rating-curve.csv

initialization:
  # INITIAL CONDITION = dry start (default): the domain starts dry except a thin
  # water plug at the inflow line (a fully dry bed makes DEBIMP abort at the
  # prescribed-Q inflow). Tune the plug if needed:
  # dry_start_depth: 0.5    # inflow-plug seed depth [m]; raise if DEBIMP reports a
  #                         # supercritical entrance, lower for a thinner plug
  # dry_start_extent: 7.5   # plug buffer around the inflow line [m] (default ~5 cells)
  # pre-wetting (hotstart) - the ALTERNATIVE to the dry start: wet the channel
  # mesh-zone up front (needs geodata.mesh_zones), so the solver need not march the
  # wetting front from the inflow. The mesh-convergence study sets it internally;
  # leave it off for a dry initial run.
  # prewet_depth: 0.5
  # HOW the seeded water surface is built:
  #   normal-depth (default) - a real cross-section every prewet_bin_spacing metres
  #     along the centerline, seeded at the stage that conveys prescribed_flowrate
  #     through it (the same conveyance inversion as the outflow rating).
  #   constant - the older "low bed percentile + prewet_depth" surface; also the
  #     automatic fallback without a centerline or a discharge.
  # SEED LOW, NOT HIGH. A 2D model has neither infiltration nor evaporation, so any
  # water seeded ABOVE the surface the run converges to can never leave: it stalls as
  # stagnant film on bar tops and bank shelves and no amount of extra runtime removes
  # it. Under-seeding costs nothing - the flow refills a pool in seconds. Hence
  # prewet_fill < 1 and the prewet_min_depth floor (never lay down a feathered margin,
  # which is exactly what stalls). Check the result with the wetting report that
  # initial_run.py writes (wetting-report.csv).
  # prewet_mode: normal-depth
  # prewet_fill: 0.70         # fraction of the normal depth above the thalweg
  # prewet_min_depth: 0.05    # [m] leave a node dry rather than seed less than this
  # Measure the seed depth from each node's SPILL elevation rather than its bed, so
  # nothing is seeded below the rim of a closed depression it could never drain from.
  # drainable_prewet: true

mesh:
  # Anisotropic, flow-aligned strategy (used when geodata.mesh_zones +
  # geodata.channel_centerline are set). Each polygon in the mesh-zones layer is
  # classified by its 'Zone Name' (case-insensitive substring) into one of THREE
  # types and sized by its own 'Max Edge Length (m)' field:
  #   * "channel"     -> triangles elongated ALONG the centerline
  #   * "floodplain"  -> near-equilateral triangles
  #   * "refinement"  -> near-equilateral triangles at a (smaller) edge length, for
  #                      LOCAL refinement (e.g. around a structure)
  # Overlaps resolve finest-first (refinement > channel > floodplain). The
  # 'Max Edge Length (m)' field is read per polygon (decimal point or German comma
  # accepted); the *_size values below are FALLBACKS for polygons without it.
  channel_size: 0.5            # fallback channel edge length (m)
  floodplain_size: 1.5         # fallback floodplain edge length (m); default outside zones
  refinement_size: 0.5         # fallback 'refinement' zone edge length (m)
  # size_scale: 1.0            # global multiplier on EVERY target edge length above
  #                            # INCLUDING the per-zone gpkg values; the mesh-
  #                            # convergence study varies this per level - leave at 1
  growth_ratio: 1.2            # max edge-size growth per element (channel -> floodplain)
  channel_anisotropy: 4.0      # along-flow / cross-flow edge ratio in the channel
  max_aspect_ratio: 4.0        # hard cap on cell aspect ratio (longest:shortest edge);
                               # enforced via gmsh AnisoMax + post-mesh edge flips
  # zone_name_field: "Zone Name"  # attribute naming each mesh zone (default shown)
  # mesh-quality report thresholds (warnings only; the channel's intended
  # anisotropy is exempt). The build logs per-region angle/aspect/skew stats, the
  # shortest edge (critical for the CFL-limited time step), and adjacent-cell area
  # jumps; it aborts on invalid geometry (zero-area/inverted/duplicate nodes).
  # min_angle_deg: 30.0        # warn if floodplain cells fall below this angle
  # max_angle_deg: 90.0        # warn on obtuse floodplain cells above this angle
  # max_area_jump: 0.20        # warn on adjacent-cell area jumps over 20%

  # Isotropic fallback (used when no mesh_zones/centerline are given):
  # default_size: 10.0         # background target edge length (m)
  # breakline_size: 3.0        # refinement along breaklines (m)
  # min_size: 0.5
  # region_sizes: {1: 1.5, 2: 3.0}   # optional per-MATID refinement (edge length m)

friction:
  # The friction .tbl is derived, in priority order, from: explicit `zones`
  # below (MATID scheme) -> else the roughness zones (geodata.roughness_zones +
  # roughness_table: one row per Zone ID with its ks under `roughness_law`) ->
  # else a single uniform default. With roughness zones the .tbl gets rows like
  # `1 NIKU 0.2000 NULL` / `2 NIKU 0.5000 NULL` matching the geometry's per-node
  # FRIC_ID; HydroBayesCal perturbs the ks via zone1/zone2 (see calibration).
  roughness_law: 5             # law for roughness-zone rows (5 = NIKU, ks in m)
  default_law: 4               # 4 = Manning (0 NOFR, 1 HAAL, 2 CHEZ, 3 STRI, 5 NIKU, 7 COWH)
  default_coefficient: 0.03
  # lateral (wall) boundary friction -> TELEMAC LAW OF FRICTION ON LATERAL
  # BOUNDARIES / ROUGHNESS COEFFICIENT OF BOUNDARIES. Also the roughness used to
  # synthesise the outflow stage-discharge curve (initial_run.py) when missing.
  boundary_law: 4              # 3 = Strickler (Kst), 4 = Manning (n)
  boundary_coefficient: 0.03
  # explicit per-MATID zones (override the roughness zones; "matid" must equal the
  # MATID in region_points). The coefficient is the initial guess calibration perturbs.
  # zones:
  #   - { matid: 1, name: riverbed,   law: 4, coefficient: 0.030 }
  #   - { matid: 5, name: floodplain, law: 4, coefficient: 0.060 }

hydrodynamics:
  # the initial run (steady2d.cas) is ALWAYS steady; when boundaries.inflow carries
  # a varying hydrograph an additional unsteady2d.cas (+ liquid-boundaries file) is
  # written too. 'regime' is kept for provenance/labelling.
  regime: steady               # steady | unsteady
  # Stable-numerics defaults (see steady2d.cas). With variable_timestep on, time_step
  # is only the conservative CFL START step; the run is marched to steady state for
  # `duration` seconds of simulated time (decoupled from the small start step) while
  # TELEMAC holds desired_courant. These, plus implicitation 0.80, free-surface
  # gradient compatibility 0.9, H CLIPPING NO, DISCRETIZATIONS IN SPACE 11;11 and the
  # k-epsilon solve budget, are the explosion-safe solver settings axqua writes.
  time_step: 0.25              # conservative CFL start step [s]; CFL-adapted thereafter
  duration: 5000.0             # simulated time [s] for the steady march to convergence
  n_time_steps: 15000          # only bounds a FIXED-step run (variable_timestep: false)
  # Steady-state auto-stop is OFF by default and ONLY honoured with a fixed time
  # step. TELEMAC's STOP CRITERIA is an ABSOLUTE per-step change; with the variable
  # (CFL) time step the per-step change is tiny, so it false-fires during a slow
  # transient (e.g. a low-Q reach still filling) long before the fluxes balance.
  # Convergence is judged by the boundary-flux balance (initial_run.py).
  # stop_if_steady: true          # only takes effect with variable_timestep: false
  # stop_criteria: "1.E-4;1.E-4;1.E-4"   # absolute per-step change: H; (U,V); tracers
  graphic_printout_period: 500
  listing_printout_period: 500
  # Numerics: the classic finite-element kernel is the default (it supports the
  # turbulence closures auto-selected below). Set finite_volumes: true for the HLLC
  # finite-volume kernel - robust for transcritical wetting/drying flow, but it
  # accepts ONLY turbulence model 1 (constant viscosity).
  finite_volumes: false
  # finite_volume_scheme: 5    # 5 = HLLC (default); 0 Roe, 1 kinetic, 6 WAF
  # fv_space_order: 2          # 2 = MUSCL (2nd order); 1 = 1st order
  # Turbulence: "auto" picks k-epsilon (3) / Spalart-Allmaras (6) / Smagorinski LES
  # (4) from the channel mesh resolution vs the turbulence length scale (the flow
  # depth) and the velocity guess, applying the 80%-TKE LES criterion. A literal
  # int/name overrides. (Finite volumes force model 1 regardless.)
  turbulence_model: auto       # auto | 1 const | 3 k-epsilon | 4 Smagorinski | 6 Spalart-Allmaras
  initial_velocity_guess: 1.0  # assumed mean flow [m/s]; sizes eddy viscosity + model choice
  # turbulence_length_scale: 1.0  # integral length scale [m]; defaults to prewet_depth
  # velocity_diffusivity: 1.0e-6  # constant eddy viscosity [m2/s]; auto from U for model 1
  # CFL-adaptive marching to steady state (variable_timestep true by default): the
  # desired_courant sets the target Courant number. 0.30 (the default) is the
  # explosion-safe target on the fine channel mesh; raise it toward ~0.6-0.9 to
  # converge in fewer steps once the case is known to be stable, or extend `duration`
  # if a run has not converged within the budget.
  # desired_courant: 0.30

# drying:                      # optional: remove water too thin to be surface flow
#                              # On a bed with Nikuradse ks 0.05-0.5 m, water 5 mm
#                              # deep is not flowing OVER the bed - it stands WITHIN
#                              # the grain roughness, and in the field it drains into
#                              # the substrate. A 2D model has no substrate, so it
#                              # stays put and paints a wetted area far larger than
#                              # the reach has (measured on a braided gravel reach:
#                              # the sub-cm band was 13 % of the wetted AREA but
#                              # 0.16 % of the volume).
#                              # TELEMAC has no keyword for this: H CLIPPING +
#                              # MINIMUM VALUE OF DEPTH do the OPPOSITE (the dico
#                              # says the truncation "is equivalent to adding mass").
#                              # So it is generated into the same USER_RAIN routine
#                              # the gain-lose exchange uses - which is why it
#                              # currently needs a gain_lose reach in fortran mode:
#                              # the water it withdraws is reinjected at the gaining
#                              # face, keeping the domain mass-exact. That matters -
#                              # a permanent net sink S makes the steady budget read
#                              # |Q_in| - |Q_out| = S and puts a floor under the
#                              # relative flux imbalance, so no hotstart would be
#                              # written again.
#   film_infiltration: true
#   film_depth: 0.01           # [m] shallower than this ...
#   film_velocity: 0.005       # [m/s] ... AND slower than this = film. The velocity
#                              # gate keeps the term off the active wet/dry margin.
#   film_rate: 1.0e-5          # [m/s] withdrawal rate; clears a 5 mm film in ~500 s

# gain_lose:                   # optional: a reach that loses flow into a porous
#                              # body (a gravel bar, an alluvial patch) and regains
#                              # it downstream. A 2D model has no subsurface, so the
#                              # underflow is a withdrawal where water infiltrates
#                              # plus an injection where it resurfaces - generated
#                              # into a USER_RAIN routine that is depth-limited (it
#                              # can never dry a cell) and mass-exact (what it takes
#                              # is returned in the same step, so no net sink appears
#                              # in the boundary budget).
#   enabled: true
#   zone: user-sources/geodata/porous-body.gpkg   # [REQUIRED] the porous body
#
#   # WHERE the exchange happens.
#   #   water-table (default) - the faces follow the physics and NOTHING is drawn.
#   #     The body's saturated zone is bounded by the two channel levels it exchanges
#   #     with, so the water table is known; a node then LOSES where it is wet and
#   #     its free surface stands above the table, and GAINS where the table stands
#   #     above the bed. The faces move with the stage. Needs
#   #     geodata.channel_centerline (the zone is projected onto it to find the two
#   #     ends). Use this unless the exchange location is genuinely known - it is
#   #     usually fuzzy exactly where percolation begins and ends.
#   #   lines - pinned to the int-* lines of boundaries.liquid_boundaries, each
#   #     buffered to a strip. Pick this for a surveyed seepage face or spring line.
#   faces: water-table
#
#   # HOW BIG it is - one of:
#   #   conductivity (kf) drives it by default: Green-Ampt's saturated limit at the
#   #     local head, so the exchange responds to water level. Riverbed kf spans
#   #     orders of magnitude with grain size and colmation, so CALIBRATE it rather
#   #     than assume: axqua exposes it to HydroBayesCal as `f.HMP_KF` (add
#   #     "POROUS ZONE kf (gain-lose)" to calibration.parameters).
#   #     Look values up in Calver, A. (2001), "Riverbed Permeabilities: Information
#   #     from Pooled Data", Ground Water 39(4), 546-553,
#   #     doi:10.1111/j.1745-6584.2001.tb02343.x
#   #     https://ngwa.onlinelibrary.wiley.com/doi/10.1111/j.1745-6584.2001.tb02343.x
#   #     (pooled riverbed values 1e-9..1e-2 m/s, concentrated 1e-7..1e-3). Bracket:
#   #     clean gravel 1e-2..1e-1, moderately colmated 1e-4..1e-3, silted 1e-7..1e-5.
#   #   discharge overrides kf with a MEASURED total [m3/s], normalised over the
#   #     losing face. Works with either `faces` setting.
#   conductivity: 3.0e-4
#   # discharge: 0.065
#
#   porous_depth: 0.5          # Lz [m]; the zone layer's own field wins
#   suction: 0.2               # hf [m], Green-Ampt wetting-front suction
#   # How far the faces may reach OUTSIDE the polygon [m]. A bar polygon outlines the
#   # bar, while the water it takes in is in the channel beside it, so the losing
#   # face has to reach the wetted edge. Default: one channel cell.
#   # zone_buffer: 0.5
#   min_depth: 0.05            # [m] never withdraw below this depth
#   taper_depth: 0.05          # [m] linear taper band above min_depth
#   max_rate: 0.001            # [m/s] ceiling on the local withdrawal rate
#
#   # WATER TABLE of the porous body (the phreatic surface joining the two channel
#   # levels). Needed for faces: water-table, and worth having anyway: the pre-wet
#   # seeds any ground below it, so closed depressions ON the bar start full - they
#   # can never fill otherwise, since no surface flow reaches a hollow that sits
#   # above the channel.
#   water_table: phreatic
#   # water_table_levels: {losing: 817.318, gaining: 816.807}  # else derived
#   patch_drain: true          # also infiltrate water standing ON the bar

# morphodynamics:              # optional GAIA extension (coupled by unsteady_run.py)
#   enabled: true              # master switch (also settable via unsteady_run.py toggles)
#   bedload: true              # BED LOAD FOR ALL SANDS
#   suspended_load: false      # SUSPENSION FOR ALL SANDS (suspended load, carried as tracers)
#   bedload_formula: 1         # BED-LOAD TRANSPORT FORMULA (1 = Meyer-Peter & Mueller)
#   coupling_period: 1         # hydro time steps per GAIA step (COUPLING PERIOD FOR GAIA)
#   gaia_results_base: rgaia
#   sediment_classes:          # one entry per sediment class (diameter [m], density, Shields)
#     - { diameter: 0.0008, density: 2650, shields: 0.047 }

dem_of_difference:
  # Optional DEM-of-Difference (DoD): the bed-change raster geodata.dem_target minus
  # geodata.dem_initial, computed during pre-processing on the ROI-clipped grid (so it
  # is inherently clipped to geodata.boundary) and thresholded by a minimum LEVEL OF
  # DETECTION (minLoD) - the survey-uncertainty floor below which a change is just
  # noise. Independent of the GAIA morphodynamics toggle; needs geodata.dem_target (or
  # a precomputed geodata.dem_of_difference). Written to preprocessing/dem-of-difference.tif.
  enabled: false
  # Level of detection - choose ONE approach:
  #  (a) propagated survey uncertainty (best-available; Brasington/Wheaton):
  #      LoD = t * sqrt(uncertainty_initial^2 + uncertainty_target^2), with t the
  #      two-tailed critical value for confidence_level (0.95 -> 1.96). Set both
  #      per-DEM vertical errors (1-sigma, m):
  # uncertainty_initial: 0.05   # vertical 1-sigma error of dem_initial [m]
  # uncertainty_target: 0.03    # vertical 1-sigma error of dem_target [m]
  # confidence_level: 0.95      # two-tailed confidence for the propagated LoD
  #  (b) a fixed threshold you already trust (overrides the propagated value):
  # min_lod: 0.10               # explicit minimum level of detection [m]
  mask_below_lod: true          # |dz| < LoD -> nodata (true) or 0.0 (false)

# =============================================================================
# OPTIONAL: structures - dams, weirs, walls, buildings
# =============================================================================
# A structure is an ORDINARY QGIS VECTOR LAYER, not a triangulated surface. STL is a
# snappyHexMesh requirement; axqua writes its own mesh, so a structure only has to
# say where its footprint is and how high it stands. No CAD step, nothing QGIS cannot
# author. Read by BOTH solvers from the same layer.
#
# Draw it either way:
#   * a POLYGON is the footprint directly      (building, dam body, pier)
#   * a LINE is buffered by its Width (m)      (trace the crest, say how thick it is)
#
# Say how high, and the field you fill in is what decides:
#   * Crest (m)   a LEVEL crest              -> dam, weir, floodwall
#   * Height (m)  FOLLOWS the terrain        -> embankment, levee of constant height
#
# Two modes, from the Type text (or an explicit Mode column per feature):
#   * overflow  dam / weir / levee / block ramp - water passes over it.
#               The BED IS RAISED to the crest. Identical in both solvers.
#   * solid     wall / floodwall / building / pier - never overtopped.
#               OpenFOAM REMOVES the footprint (no-slip walls from bed to lid);
#               TELEMAC has no vertical wall to remove, so it raises the bed to
#               crest + solid_freeboard_2d instead (standard 2D practice).
# Unrecognised text is treated as overflow: raising the bed keeps the domain
# connected, whereas wrongly blanking a footprint would silently wall off the reach.
#
# geodata:
#   structures: user-sources/geodata/structures.gpkg
#
# structures:
#   type_field: "Type"            # dam | weir | wall | building | embankment ...
#   mode_field: "Mode"            # optional per-feature override: solid | overflow
#   crest_field: "Crest (m)"      # LEVEL crest elevation [m a.s.l.]
#   height_field: "Height (m)"    # or: height above the local ground [m]
#   width_field: "Width (m)"      # line features only
#   name_field: "Name"
#   default_width: 1.0            # [m] when a line carries no width
#   solid_freeboard_2d: 2.0       # [m] TELEMAC only: how far above the crest a
#                                 # solid structure is raised so it is not overtopped

# =============================================================================
# OPTIONAL: OpenFOAM free-surface (interFoam) extension
# =============================================================================
# Delete this whole block and nothing about the TELEMAC case changes - it is read
# only by openfoam_preprocessing.py / openfoam_run.py / `axqua openfoam`.
#
# Use it when you need the VERTICAL structure of the flow AND the water surface has
# a gradient. The second half is why simpleFoam is not an option: a steady
# single-phase solver cannot carry a sloping free surface, so the air-water
# interface has to be modelled, which means a two-phase VOF solver (interFoam) and
# with it an air phase that is of no interest but tends to dominate the cost.
#
# Build it only AFTER preprocessing.py + initial_run.py have produced a converged
# simulation/r2d.slf: the 3D case is seeded from it, its lid follows its water
# surface, and its footprint is that result's wetted corridor. Ideally after
# mesh_convergence_study.py too, so `cell_size` is an informed choice.
#
# openfoam:
#   bashrc: /opt/openfoam9/etc/bashrc   # [REQUIRED to run] your OpenFOAM etc/bashrc
#   n_processors: 8
#
#   # ---- the TELEMAC pre-run that seeds this case -------------------------
#   # OpenFOAM is the expensive model in the chain; TELEMAC answers in minutes
#   # what it would otherwise spend hours discovering - where the water is, how
#   # deep it is, roughly where its surface sits. That seed puts the wetted cells
#   # in water at t=0, clamps the lid just above the surface so most air cells
#   # never exist, and trims the footprint to the wetted corridor. Without it the
#   # case is built COLD under a flat lid: many times more air cells, plus the
#   # whole filling transient, in the slowest solver you have.
#   #
#   # The seed is an approximation and is treated as one - the 3D surface is still
#   # SOLVED and free to leave it, and the run reports whether it ever needed more
#   # room than freeboard/wet_margin gave it.
#   pre_run:
#     enabled: true         # uncheck to never start TELEMAC (also: --no-pre-run)
#     reuse: true           # a converged r2d.slf beats a fresh coarse run
#     dimension: 2d         # 3d also seeds a vertical velocity PROFILE per column
#     size_scale: 2.0       # how much coarser the DEDICATED pre-run is meshed
#     courant: 0.6          # pre-wetted, so it can march faster than a dry start
#     prewet_depth: 0.5     # [m] hotstart the channel zone
#     require: warn         # warn | error, if it misses flux balance
#
#   # ---- mesh -------------------------------------------------------------
#   # A structured, terrain-following, ALL-HEXAHEDRAL lattice written straight to
#   # constant/polyMesh. NOT snappyHexMesh: a river bed is a single-valued height
#   # field, so it is followed rather than snapped to, which removes the
#   # castellate/snap stage where that mesher degenerates into slivers.
#   cell_size: 0.5          # plan dx [m]
#   n_layers: 14            # sigma layers per column
#   # Check the cost before building:
#   #   axqua openfoam case-config.yml --check
#
#   # ---- what is actually solved: vof | rigid-lid --------------------------
#   # `vof` (default) is the real two-phase model: the free surface is FOUND. That
#   # is the answer you came for, and it is expensive.
#   #
#   # `rigid-lid` is for getting there. It puts the lid ON the 2D free surface as a
#   # slip wall, so the domain holds water only and alpha is identically 1 -
#   # interFoam degenerates to single-phase while p_rgh and gravity stay intact. No
#   # interface Courant limit, no air jets, no spin-up stage, and the ~90% of cells
#   # that were air are simply absent. Use it to shake out the mesh, the boundaries
#   # and the roughness in minutes, then switch to `vof`.
#   #
#   # WHAT YOU GIVE UP is the free surface: it can no longer move, so this mode
#   # cannot show a hydraulic jump, a standing wave, or superelevation in a bend.
#   # mode: rigid-lid
#   # cell_size_factor: 5.0   # coarsen x5 vs the 2D channel size; overrides cell_size
#   # min_water_depth: 0.20   # [m] rigid-lid only: skip shallower columns. Raising it
#   #                         # can trim away a shallow INLET section - check the
#   #                         # patch list. n_layers is then fitted to it, since cells
#   #                         # thinner than the bed grains are meaningless.
#   domain: wetted          # wetted (the 2D wetted corridor) | roi (the whole ROI)
#   wet_margin: 5.0         # [m] buffer, so the bank walls stand on DRY ground
#   align_to_flow: true     # rotate the lattice onto the reach's principal axis
#
#   # ---- the air phase ----------------------------------------------------
#   # The single biggest lever. The lid is clamped this far above the 2D free
#   # surface instead of being a flat plane over the terrain, so most air cells
#   # never exist, and the atmosphere patch stays near the interface where
#   # inletOutlet / totalPressure behave. It must still exceed any surface rise the
#   # 3D run can produce, or the flow hits the lid.
#   lid: follow             # follow | flat
#   freeboard: 0.5          # [m]
#   # `auto` sizes freeboard AND wet_margin from the seed's own flow - the velocity
#   # head V2/2g the water could convert at a stagnation point or a bend, plus a
#   # quarter of the depth for what a depth-averaged model cannot see at all - and
#   # treats the values here as FLOORS, never caps. So a slow reach keeps the air it
#   # asked for and a fast one gets the room it needs to disagree with the 2D seed.
#   headroom_mode: auto     # auto | fixed
#   bank_slope: 0.1         # [-] turns a surface rise into the wet_margin it needs
#   # |U| cap enforced by the limitVelocity fvConstraint. Unset -> 5x the reach's
#   # p95 water speed. Water never reaches it; a runaway air jet does, and that is
#   # what collapses the time step.
#   # air_velocity_cap: 4.0
#
#   # ---- bed --------------------------------------------------------------
#   # nutkRoughWallFunction needs the first cell CENTRE above the roughness crests,
#   # so the bed layer is pinned to 2x the wetted median ks. On a gravel bed where
#   # ks is a large fraction of the depth this cannot always be met; the build
#   # reports the share of wetted bed faces that fail, and OpenFOAM will NOT error
#   # there - it clamps and carries on. Read such a result as bulk flow, not as a
#   # resolved bed boundary layer. Refining towards the bed makes it worse.
#   # Defaults OFF under a rigid lid: pinning a thick bed layer into a shallow
#   # column leaves the layers above it thin enough to fold, which checkMesh rejects.
#   auto_bed_layer: true
#   # bed_layer_height: 0.2   # explicit override [m]
#   turbulence: kOmegaSST   # kOmegaSST | kEpsilon | laminar
#
#   # ---- run --------------------------------------------------------------
#   # Two stages: stage 1 settles the interface from the depth-averaged 2D state at
#   # a tight Courant number, stage 2 runs at the full one with semi-implicit MULES
#   # (which is what makes 0.9 affordable instead of the tutorials' 0.2).
#   spinup_time: 30.0
#   end_time: 300.0
#   spinup_courant: 0.3
#   max_courant: 0.9
#   write_interval: 10.0

ground_truth:
  # The calibration consumes a tidy, multi-tab "measurements" table: one tab per
  # category (hydraulics, morphodynamics, ...), first three columns x,y,z (project
  # CRS), then quantity columns. Provide it one of three ways:
  #
  #   (a) RECOMMENDED - the calibration-target template: run
  #           axqua targets case-config.yml
  #       to generate user-sources/ground-truth/calibration-target-data.xlsx (plus
  #       a co-located extract_flowtracker.py helper), fill it in, and reference it
  #       under `targets` below. Its tabs:
  #         hydraulics      - per vertical: u_x/u_y/u_z, fluctuations u_x'/u_y'/u_z',
  #                           U_h + U_h' + TKE (live formulas; recomputed on ingest),
  #                           water depth, bottom elevation. Fill straight from SonTek
  #                           FlowTracker2 exports with the co-located script:
  #                             python extract_flowtracker.py FT-day1.xlsx FT-day2.xlsx
  #                           (each point keyed by its ID; u' = sample std-dev, not VxErr)
  #         morphodynamics  - grain sizes d16..d90 [mm], fine fraction < 1 mm, and a
  #                           dz column auto-sampled from the DEM of Difference when
  #                           geodata.dem_target / dem_of_difference provides one
  #         parameters      - drop-down calibration parameters (TELEMAC-2D/3D/GAIA
  #                           catalog incl. friction zones, critical Shields stress,
  #                           minimum depth, eddy viscosity/diffusivity, secondary
  #                           currents ...) with min/max test ranges + range tips;
  #                           merged into `calibration.parameters` (template wins)
  #       Rows are keyed by a UNIQUE ID joining the point layers below (any CRS;
  #       reprojected on ingest), or carry explicit x/y.
  #   (b) author the tidy table yourself and point `measurements` at the .xlsx;
  #   (c) declare raw sources under `sources` and axqua compiles the tidy table
  #       for you. Compiled to preprocessing/ground-truth.xlsx unless `measurements`
  #       gives an explicit output path.
  #
  # targets:                                     # (a) filled calibration-target template
  #   file: user-sources/ground-truth/calibration-target-data.xlsx
  #   hydraulics_positions: user-sources/geodata/dgps-points.gpkg    # point layer with 'ID'
  #   sediment_positions: user-sources/geodata/sediment-samples.gpkg # point layer with 'ID'
  #   join_key: ID
  # measurements: user-sources/ground-truth/ground-truth.xlsx   # (b) user-authored tidy table
  # sources:                                     # (c) raw sources -> compiled tidy table
  #   # e.g. FlowTracker velocities (values) joined by ID to DGPS survey points
  #   # (positions, reprojected to the project CRS); one entry per source/tab.
  #   - { category: hydraulics, kind: flowtracker, join_key: ID,
  #       values: user-sources/ground-truth/hydraulics/flowtracker-day1.xlsx,
  #       positions: user-sources/geodata/flowtracker/dgps-day1.shp }

calibration:
  calibration_quantities: ["WATER DEPTH"]                    # measured columns used for calibration
  extraction_quantities: ["WATER DEPTH", "SCALAR VELOCITY"]  # quantities pulled from results
  measurement_error: 0.10      # fraction of the measured value
  init_runs: 30                # initial design samples
  max_runs: 50                 # total runs (initial + active-learning iterations)
  gp_library: gpy
  # calibration parameters forwarded to HydroBayesCal. Names follow its prefix
  # convention: zone<N> (friction zone N in the .tbl), gaiaCLASSES SHIELDS
  # PARAMETERS <n> (GAIA), vg_zone<N>-<p> (vegetation), or any literal TELEMAC
  # keyword. zone1/zone2 here perturb the Nikuradse ks of two roughness zones
  # (channel / floodplain); ranges are ks bounds in metres.
  parameters:
    - { name: zone1, min: 0.05, max: 0.50, comment: "channel ks [m] (Nikuradse)" }
    - { name: zone2, min: 0.10, max: 1.00, comment: "floodplain ks [m] (Nikuradse)" }
    # - { name: "gaiaCLASSES SHIELDS PARAMETERS 1", min: 0.030, max: 0.060 }
