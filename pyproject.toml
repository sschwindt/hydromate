[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromate"
version = "0.1.0"
description = "Automated setup of calibration-ready TELEMAC-2D/3D + GAIA cases for the Inn river, feeding HydroBayesCal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Sebastian Schwindt" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "pyproj",
    "shapely>=2.0",
    "geopandas",
    "rasterio",
    "gmsh>=4.13",
    "openpyxl>=3.1",
    # flux-convergence + cross-section plots and the P1 triangle interpolation
    # (hydromate.flux_convergence, hydromate.sections); previously pulled in
    # transitively by pythomac, which the flux analysis no longer uses.
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
gui = ["streamlit>=1.30"]
# Surrogate-assisted Bayesian calibration (hydromate.bayescal / hydromate.calibration).
# An EXTRA rather than a core dependency: it pulls in bayesvalidrox, gpytorch and
# scikit-learn, none of which is needed to build or run a TELEMAC case, which is what
# most of hydromate does.
# >=1.4.2 is required, not merely preferred: that is the release that ships the
# calibration drivers *with the package* (hydroBayesCal.copy_driver). Before it, the
# drivers lived only in a source checkout, so hydromate had to be told where that
# checkout was via an environment variable - which broke whenever it moved or was
# absent on a machine.
calibration = ["hydrobayescal>=1.4.2"]

[project.scripts]
hydromate = "hydromate.cli:main"
hydromate-gui = "hydromate.gui.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hydromate = ["templates/*.cas", "templates/*.tbl"]

[tool.ruff]
line-length = 100
