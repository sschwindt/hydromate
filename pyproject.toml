[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromate"
version = "0.1.0"
description = "Automated setup of calibration-ready TELEMAC-2D/3D + GAIA cases for the Inn river, feeding HydroBayesCal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Sebastian Schwindt" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "pyproj",
    "shapely>=2.0",
    "geopandas",
    "rasterio",
    "gmsh>=4.13",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
hydromate = "hydromate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hydromate = ["templates/*.cas", "templates/*.tbl"]

[tool.ruff]
line-length = 100
