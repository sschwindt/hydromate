# Conda/mamba environment for the Inn TELEMAC setup-automation workflow (hydromate).
#
# This environment runs the *case-building* pipeline (DEM clipping, gmsh meshing,
# SELAFIN/CLI/CAS/TBL generation, calibration CSV + hydrobayescal config emit).
# The actual TELEMAC solver is invoked by *sourcing* the TELEMAC pysource shell
# script defined in the user config (see config/inn.yml -> telemac.pysource), so
# this env only needs the geospatial/meshing stack, not TELEMAC's Python.
#
# Create with:
#   mamba env create -f environment.yml
#   mamba activate hydromate-env
#   pip install -e .
name: hydromate-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - pyyaml
  - pyproj
  - shapely>=2.0
  - geopandas
  - rasterio
  - fiona
  - gdal
  - matplotlib
  - openpyxl>=3.1
  - pip
  - pip:
      - gmsh>=4.13
